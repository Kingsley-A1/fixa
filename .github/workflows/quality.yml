name: Fixa Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Lint
        run: pnpm run lint
      - name: Strict type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:unit
      - name: Production build (no credentials)
        run: pnpm run build
      - name: Install Chromium for responsive QA
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Responsive visual and interaction QA
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec playwright test tests/public-layout.spec.ts --project=desktop
      - name: Archive layout screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixa-public-layout-six-widths
          path: artifacts/public-qa/
          retention-days: 7
          if-no-files-found: warn
