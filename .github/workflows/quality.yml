name: Fixa Quality Gate
on:
  pull_request:
    branches: [main, feat/releases-1-3-trust-discovery-20261030]
  push:
    branches: [feat/google-auth-email-work-portfolio-20261030]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Lint
        run: pnpm run lint
      - name: Strict type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:unit
      - name: Production build (no credentials)
        run: pnpm run build
